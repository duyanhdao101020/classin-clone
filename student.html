<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LopHoc — Lớp của tôi</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="brand"><span class="dot"></span> LopHoc</div>
    <div style="display:flex; align-items:center; gap:14px;">
      <span class="who" id="who">Học viên</span>
      <button class="btn btn-ghost btn-sm" id="logout-btn">Đăng xuất</button>
    </div>
  </div>

  <div class="dash">
    <h1>Lớp học của tôi</h1>
    <p class="sub">Nhập mã lớp mà giáo viên đã gửi để tham gia.</p>

    <form class="new-class-form" id="join-form">
      <input type="text" id="join-code" placeholder="Nhập mã lớp, vd: A3F9K2" maxlength="6" style="text-transform:uppercase;" required>
      <button type="submit" class="btn btn-amber">Tham gia lớp</button>
    </form>
    <div class="error-msg" id="join-err"></div>

    <div class="grid" id="class-grid"></div>
    <div class="empty" id="empty-state" style="display:none;">
      Bạn chưa tham gia lớp nào. Nhập mã lớp ở trên để bắt đầu.
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/student.js"></script>
</body>
</html>
