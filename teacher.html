<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thiên Bình dạy tiếng Trung — Lớp học của tôi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="brand"><span class="dot"></span> Thiên Bình dạy tiếng Trung</div>
    <div style="display:flex; align-items:center; gap:14px;">
      <span class="who" id="who">Giáo viên</span>
      <button class="btn btn-ghost btn-sm" id="logout-btn">Bắt đầu lại (tên khác)</button>
    </div>
  </div>

  <div class="dash">
    <h1>Lớp học của tôi</h1>
    <p class="sub">Tạo lớp mới rồi gửi mã cho học viên để họ tham gia.</p>

    <form class="new-class-form" id="new-class-form">
      <input type="text" id="class-name" placeholder="Tên lớp học, vd: Toán 8A" required>
      <button type="submit" class="btn btn-amber">+ Tạo lớp mới</button>
    </form>

    <div class="grid" id="class-grid"></div>
    <div class="empty" id="empty-state" style="display:none;">
      Bạn chưa có lớp học nào. Tạo lớp đầu tiên ở trên nhé.
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="teacher.js"></script>
</body>
</html>
