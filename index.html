<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LopHoc — Đăng nhập</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="brand"><span class="dot"></span> LopHoc</div>
    <div class="who">Lớp học trực tuyến</div>
  </div>

  <div class="main">
    <div class="card auth-card">
      <h1 id="form-title">Chào mừng trở lại</h1>
      <p class="sub" id="form-sub">Đăng nhập để vào lớp học của bạn</p>

      <div class="error-msg" id="err"></div>

      <div class="role-toggle" id="role-toggle" style="display:none;">
        <button type="button" class="active" data-role="student">Tôi là học viên</button>
        <button type="button" data-role="teacher">Tôi là giáo viên</button>
      </div>

      <form id="auth-form">
        <div class="field" id="name-field" style="display:none;">
          <label>Họ tên</label>
          <input type="text" id="name" placeholder="Nguyễn Văn A">
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="email" required placeholder="ban@vidu.com">
        </div>
        <div class="field">
          <label>Mật khẩu</label>
          <input type="password" id="password" required placeholder="Tối thiểu 6 ký tự">
        </div>
        <button type="submit" class="btn btn-amber" style="width:100%;" id="submit-btn">Đăng nhập</button>
      </form>

      <div class="switch-line">
        <span id="switch-text">Chưa có tài khoản?</span>
        <a href="#" id="switch-link">Đăng ký ngay</a>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
