<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thiên Bình dạy tiếng Trung — Vào lớp</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="brand" id="brand-logo" style="cursor:default; user-select:none;"><span class="dot"></span> Thiên Bình dạy tiếng Trung</div>
    <div class="who">Lớp học trực tuyến</div>
  </div>

  <div class="main">
    <div class="card auth-card">
      <h1>Vào lớp học</h1>
      <p class="sub" id="form-sub">Nhập tên của bạn rồi bấm "Bắt đầu" để vào lớp — không cần mật khẩu.</p>

      <div class="error-msg" id="err"></div>

      <div class="role-toggle" id="role-toggle" style="display:none;">
        <button type="button" class="active" data-role="student">Tôi là học viên</button>
        <button type="button" data-role="teacher">Tôi là giáo viên</button>
      </div>

      <form id="auth-form">
        <div class="field">
          <label>Tên của bạn</label>
          <input type="text" id="name" required placeholder="Nguyễn Văn A">
        </div>
        <button type="submit" class="btn btn-amber" style="width:100%;" id="submit-btn">Bắt đầu</button>
      </form>

      <p class="switch-line" style="margin-top:18px;">
        Trình duyệt này sẽ nhớ bạn cho lần sau — không cần nhập lại tên mỗi lần vào.
      </p>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
</body>
</html>
